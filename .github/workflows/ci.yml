name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  check:
    name: Check and package
    runs-on: ubuntu-24.04
    container: archlinux:base
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Arch Linux build dependencies
        run: |
          pacman -Syu --needed --noconfirm \
            base-devel git rust pkgconf libxkbcommon wayland fontconfig freetype2 python tar gzip

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run unit tests
        run: cargo test --locked --workspace

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build release archives
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: bash packaging/release.sh

      - name: Verify release archives and staged installation
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          staging=$(mktemp -d)
          trap 'rm -rf -- "$staging"' EXIT
          archive=$(find dist -maxdepth 1 -name 'snap-back-*-linux-x86_64.tar.gz' -print -quit)
          test -n "$archive"
          tar -xzf "$archive" -C "$staging"
          bundle=$(find "$staging" -mindepth 1 -maxdepth 1 -type d -print -quit)
          "$bundle/bin/snap-back" --version
          DESTDIR="$staging/install-root" bash "$bundle/install.sh"
          test -x "$staging/install-root/usr/local/bin/snap-back"
          test -x "$staging/install-root/usr/local/bin/snap-back-gui"
          test -f "$staging/install-root/etc/systemd/system/snap-back.timer"
          test ! -e "$staging/install-root/etc/snap-back/config.json"

      - name: Upload downloadable tarballs
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap-back-linux-x86_64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
