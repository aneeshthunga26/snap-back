name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  build:
    name: Validate and build release
    runs-on: ubuntu-24.04
    container: archlinux:base
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Arch Linux build dependencies
        run: |
          pacman -Syu --needed --noconfirm \
            base-devel git rust pkgconf libxkbcommon wayland fontconfig freetype2 python tar gzip

      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run unit tests
        run: cargo test --locked --workspace

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build matching release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash packaging/release.sh "$RELEASE_TAG"

      - name: Verify checksums
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish tarball downloads
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist

      - name: Verify downloaded checksums
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Publish GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const {owner, repo} = context.repo;
            const tag = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
              throw new Error('The release tag is not a supported semantic version.');
            }
            const version = tag.slice(1);
            const names = [
              `snap-back-${version}-linux-x86_64.tar.gz`,
              `snap-back-${version}-source.tar.gz`,
              'SHA256SUMS',
            ];
            for (const name of names) await fs.access(`dist/${name}`);
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
              if (!release.draft) {
                throw new Error('This release is already published; its assets will not be replaced.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `Snap Back ${tag}`, draft: true,
                prerelease: version.includes('-'),
                body: [
                  'A desktop backup and recovery prototype for CachyOS and Btrfs.',
                  '',
                  'Download the Linux x86_64 archive and SHA256SUMS below. The archive contains the GUI, helper, and installer. Installation does not format a drive.',
                  '',
                  'The source archive includes the matching project source and build dependencies. See README.md and INSTALL.md for requirements and setup.',
                  '',
                  `Source commit: ${context.sha}`,
                ].join('\n'),
              })).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id,
            });
            for (const name of names) {
              const previous = assets.find(asset => asset.name === name);
              if (previous) await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: previous.id});
              const data = await fs.readFile(`dist/${name}`);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: {'content-type': 'application/octet-stream', 'content-length': data.length},
              });
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false,
              make_latest: version.includes('-') ? 'false' : 'true',
            });
            core.notice(`Published ${release.html_url}`);
